# 飞牛 fnOS：Mihomo + Aurora + New API + MetaCubeXD
name: aurora-stack

services:
  mihomo:
    # 2026-07-27 NAS 已验证基线：v1.19.29
    image: metacubex/mihomo@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
    container_name: mihomo
    ports:
      - "${NAS_LAN_IP:?请先在 .env 中设置 NAS_LAN_IP}:9090:9090"
    volumes:
      - ./data/mihomo:/root/.config/mihomo
    restart: unless-stopped

  aurora:
    # 2026-08-04 已验证的 Aurora 2.5.0 linux/amd64 固定 digest
    image: ghcr.io/aurora-develop/aurora@sha256:358533a8cd6355222297c699338fe6cdc024c6f3d951fb2fb03422350b9b7627
    container_name: aurora
    user: "65532:65532"
    ports:
      - "8080:8080"
    environment:
      Authorization: ${AURORA_AUTHORIZATION:?请先在 .env 中设置 AURORA_AUTHORIZATION}
      PROXY_URL: http://mihomo:7890
      http_proxy: http://mihomo:7890
      ENABLE_EXTERNAL_TOKEN: "false"
    volumes:
      - type: bind
        source: ./.secrets/session_tokens.txt
        target: /home/nonroot/session_tokens.txt
        read_only: true
    depends_on:
      - mihomo
    restart: unless-stopped

  new-api:
    # 2026-08-04 目标基线：v1.0.0-rc.23
    image: calciumion/new-api@sha256:bacbbfbed64b4579213316e0ed78415985223bb20c47fbc24572dd7be5aa1695
    container_name: new-api
    ports:
      - "3000:3000"
    volumes:
      - ./data/new-api:/data
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:?请先在 .env 中设置 SESSION_SECRET}
    restart: unless-stopped

  dashboard:
    # 2026-07-27 NAS 已验证基线：v1.270.5
    image: ghcr.io/metacubex/metacubexd@sha256:67f7eeacf94a49acda9a509e10e13fa2033f7b46f76c1473164aad7cbe5762b9
    container_name: metacubexd
    ports:
      - "9097:80"
    restart: unless-stopped
